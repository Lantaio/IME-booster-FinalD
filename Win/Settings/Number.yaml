# encoding: utf-8
#
# 数字漂移自定制映射表
# 说明：
# * 🚨 1个标点符号只能出现在1个热键的1个按键列表中，并且只能出现1次！
# * ⚠ 为简化处理此文件的代码，列表中某些地方须用空格隔开，在下面的示例中用“^”标注出须要空格的地方。并且注意列表中用于分隔的“,”是英文逗号
# '1': [ '1', '₁', '¹', '➀' ]  # 注释文档
#     ^ ^    ^    ^    ^   ^  ^
# * ⚠ 此映射表中的键名不能和任何国家语言配置文件中的键名相同，否则会被覆盖。
# * 漂移时按从左到右的顺序依次变换，因此建议按标点符号的使用频率高低从左到右排列。
# * 漂移的字符暂时只支持单个字符。
#
# 网址：https://github.com/Lantaio/IME-booster-FinalD
# 作者：Lantaio Joy
# 版本：0.1.3
# 更新：2026/9/10

LShift:  # 数字变换为对应的上下标数字和空心圆圈数字
  '0': [ '0', '₀', '⁰', '⓪', '⑩' ]
  '1': [ '1', '₁', '¹', '①', '⑪' ]
  '2': [ '2', '₂', '²', '②', '⑫' ]
  '3': [ '3', '₃', '³', '③', '⑬' ]
  '4': [ '4', '₄', '⁴', '④', '⑭' ]
  '5': [ '5', '₅', '⁵', '⑤', '⑮' ]
  '6': [ '6', '₆', '⁶', '⑥', '⑯' ]
  '7': [ '7', '₇', '⁷', '⑦', '⑰' ]
  '8': [ '8', '₈', '⁸', '⑧', '⑱' ]
  '9': [ '9', '₉', '⁹', '⑨', '⑲' ]

RShift:  # 数字变换为对应的罗马数字和实心圆圈数字
  '0': [ 'Ⅹ', 'ⅹ', '⓿', '➓' ]  # ⚠ 大小写罗马数字是10，不是0！
  '1': [ 'Ⅰ', 'ⅰ', '➊', '⓫' ]
  '2': [ 'Ⅱ', 'ⅱ', '➋', '⓬' ]
  '3': [ 'Ⅲ', 'ⅲ', '➌', '⓭' ]
  '4': [ 'Ⅳ', 'ⅳ', '➍', '⓮' ]
  '5': [ 'Ⅴ', 'ⅴ', '➎', '⓯' ]
  '6': [ 'Ⅵ', 'ⅵ', '➏', '⓰' ]
  '7': [ 'Ⅶ', 'ⅶ', '➐', '⓱' ]
  '8': [ 'Ⅷ', 'ⅷ', '➑', '⓲' ]
  '9': [ 'Ⅸ', 'ⅸ', '➒', '⓳' ]
