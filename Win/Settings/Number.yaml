# 数字漂移自定制映射表
# 说明：⚠ 为简化处理此文件的代码，列表中某些地方须用空格隔开，在下面的示例中用“^”标注出须要空格的地方。并且注意列表中用于分隔的“,”是英文标点
# '1': [ '1', '₁', '¹', '➀' ]
#     ^ ^    ^    ^    ^   ^
#
# 网址：https://github.com/Lantaio/IME-booster-FinalD
# 作者：Lantaio Joy
# 版本：0.1.1
# 更新：2026/8/19

LShift:  # 数字变换为对应的上下标数字
  '0': [ '0', '₀', '⁰', '⓪' ]
  '1': [ '1', '₁', '¹', '➀' ]
  '2': [ '2', '₂', '²', '➁' ]
  '3': [ '3', '₃', '³', '➂' ]
  '4': [ '4', '₄', '⁴', '➃' ]
  '5': [ '5', '₅', '⁵', '➄' ]
  '6': [ '6', '₆', '⁶', '➅' ]
  '7': [ '7', '₇', '⁷', '➆' ]
  '8': [ '8', '₈', '⁸', '➑' ]
  '9': [ '9', '₉', '⁹', '➒' ]

RShift:  # 数字变换为对应的罗马数字
  '0': [ '⓿', '0' ]
  '1': [ 'Ⅰ', 'ⅰ', '➊' ]
  '2': [ 'Ⅱ', 'ⅱ', '➋' ]
  '3': [ 'Ⅲ', 'ⅲ', '➌' ]
  '4': [ 'Ⅳ', 'ⅳ', '➍' ]
  '5': [ 'Ⅴ', 'ⅴ', '➎' ]
  '6': [ 'Ⅵ', 'ⅵ', '➏' ]
  '7': [ 'Ⅶ', 'ⅶ', '➐' ]
  '8': [ 'Ⅷ', 'ⅷ', '➑' ]
  '9': [ 'Ⅸ', 'ⅸ', '➒' ]
