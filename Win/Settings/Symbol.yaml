# encoding: utf-8
#
# 标点符号漂移配置映射表
# 【说明】
#   见同一文件夹中的`漂移映射表自定制说明.md`。
# 【作者】Lantaio Joy
# 【版本】1.10 （v版本号.修订号。如果版本号不同，则表示有重大更新，须要根据下面的【重大更新说明】比较合并更新，或查找文件中有“✨”符号的地方。修订号为不影响和主程序适配的修改，可以不管。）
# 【更新】2026/9/20
# 【重大更新说明】
# 1.x：将“LShift”和“RShift”两个章节名修改为“Left”和“Right”。适配主程序版本 v9.81.280 ~ 最新版
# 0.x：将标点符号漂移列表从主程序分离出来的首个版本。适配 v9.81.278

Left:  # ✨️左功能键触发漂移，中、英文常用标点漂移映射表
  '.': [ '。', '.' ]
  ',': [ '，', ',' ]
  '(': [ '（', '(' ]
  ')': [ '）', ')' ]
  '_': [ '_', '——' ]
  ':': [ '：', ':' ]
  '"': [ '"', '“' ]  # 此处的‘“’只是让程序识别是要输入中文标点，程序会根据情况输入‘“’或‘”’，并且在合适的情况下会自动配对
  '/': [ '/', '÷' ]
  '=': [ '=', '⇒' ]  # 2是“推导出”
  '<': [ '《', '<' ]
  '>': [ '》', '>' ]
  ';': [ '；', ';' ]
  '-': [ '-', '⌫' ]  # 2是Backspace键符号
  '{': [ '「', '{' ]  # 和苹果键盘布局一致
  '}': [ '」', '}' ]
  "'": [ "'", '‘' ]  # 和上面双引号的作用相同
  '*': [ '*', '×' ]
  '#': [ '#', '§' ]  # 2是章节号
  '[': [ '【', '[' ]  # 和苹果键盘布局一致
  ']': [ '】', ']' ]
  '`': [ '`', 'π' ]
  '+': [ '+', '↩' ]  # 2是Enter键符号
  '&': [ '&', '※' ]  # 2是参考标志
  '?': [ '？', '?' ]
  '!': [ '！', '!' ]
  '\': [ '\', '、' ]
  '|': [ '|', '｜' ]
  '@': [ '@', '©' ]
  '%': [ '%', '‰' ]
  '^': [ '^', '……' ]
  '~': [ '~', '～' ]
  '$': [ '$', '￥' ]

Right:  # ✨️右功能键触发漂移，扩展标点符号漂移映射表
  '.': [ '℃', '°', '℉' ]  # 都有小圆圈
  ',': [ '∈', '⊆', '⊂' ]  # 逗号前后“属于”同一句
  '(': [ '〔', '〘' ]  # 列表中不是圆括号，是方头括号（也叫鱼尾括号或六角括号）
  ')': [ '〕', '〙' ]
  '_': [ '␣', '∪', '∩' ]  # 1是Space键符号；“∪”、“∩”和减号的“∨”、“∧”在同一按键
  ':': [ '∵', '∴', '∝', '∷' ]  # 都是小点点；3是“成正比于”；4是古典“比例相等”，现代被“=”号取代
  '/': [ '√', '／', '≠' ]  # 都有斜杠或开除之意；1是“根号”，也可表示“对勾”
  '=': [ '⇔', '≈', '≡', '≅' ]  # 1是“等价”；2是“约等于”；3是“恒等于”；4是“几何全等”、“同构”
  '<': [ '〈', '≤', '«', '‹' ]
  '>': [ '〉', '≥', '»', '›' ]
  ';': [ '✅', '☐', '☑', '☒' ]  # 此按键在“？”键附近，同是✔❌
  '-': [ '¬', '∨', '∧' ]  # -有非（¬）的意思，∨∧同属逻辑符号
  '{': [ '『', '｛' ]
  '}': [ '』', '｝' ]
  '*': [ '·', '＊', '∏' ]  # 意思或形状相近
  '#': [ '■', '◆', '□', '◇' ]
  '[': [ '〖', '［' ]
  ']': [ '〗', '］' ]
  '`': [ 'α', 'β', 'γ', 'λ', 'μ' ]  # 大小写希腊字母在同一按键
  '+': [ '∑', '±', '∫', '∮' ]  # 求和、累积之意
  '&': [ 'ℹ', '々', '〃', '∞' ]  # 1是emoji“信息中心”；2是叠字符号，表示重复前一个字；3是“同上”符号
  '?': [ '✔', '❌', '✘', '⭕' ]  # 问题的答案是✔或❌
  '!': [ '⚠', '▲', '🚨', '△' ]  # 都有警告之意
  '\': [ '→', '↔', '←', '＼' ]  # 和↑、↓在同一个按键
  '|': [ '↑', '↕', '↓', '‖' ]
  '@': [ '●', '®', '™', '○' ]
  '%': [ '⭐', '★', '☆', '✪' ]  # 五角星放在数字5按键
  '^': [ '⌘', '⇧', '⌥', '⇥' ]  # ^是Ctrl键符号；1是Command键符号；2是Shift键符号；3是Option键符号；4是Tab键符号
  '~': [ 'Δ', 'Ω', 'Θ', 'Λ', 'Φ' ]  # 大小写希腊字母在同一按键
  '$': [ '＄', '¥', '€', '£', '¢', '¤' ]  # 1是全角美元；2是半角元；3是英镑；4是欧元；5是美分，6是通用货币符号
