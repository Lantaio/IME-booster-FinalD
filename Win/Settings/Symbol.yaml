# encoding: utf-8
#
# 标点符号漂移自定制映射表
# 说明：
# 🚨 1个标点符号只能出现在1个热键的1个按键列表中，并且只能出现1次！
# ⚠ 为简化处理此文件的代码，列表中某些地方须用空格隔开，在下面的示例中用“^”标注出须要空格的地方。并且注意列表中用于分隔的“,”是英文逗号
# '.': [ '℃', '°', '℉' ]
#     ^ ^     ^    ^   ^
# * 漂移时按从左到右的顺序依次变换，因此建议按标点符号的使用频率高低从左到右排列。
# * 漂移的字符暂时只支持单个字符。
#
# 网址：https://github.com/Lantaio/IME-booster-FinalD
# 作者：Lantaio Joy
# 版本：0.1.5
# 更新：2026/8/23

LShift:  # 中、英文常用标点漂移映射表
  '.': [ '。', '.' ]
  ',': [ '，', ',' ]
  '(': [ '（', '(' ]
  ')': [ '）', ')' ]
  '_': [ '_', '——' ]
  ':': [ '：', ':' ]
  '"': [ '"', '“' ]
  '/': [ '/', '÷' ]
  '=': [ '=', '≈' ]
  '<': [ '《', '<' ]
  '>': [ '》', '>' ]
  ';': [ '；', ';' ]
  '-': [ '-', '¬' ]  # 第2个是逻辑非
  '{': [ '「', '{' ]  # 和苹果键盘布局一致
  '}': [ '」', '}' ]
  "'": [ "'", '‘' ]
  '*': [ '*', '×' ]
  '#': [ '#', 'ℹ' ]  # 第2个是emoji“信息”
  '[': [ '【', '[' ]  # 和苹果键盘布局一致
  ']': [ '】', ']' ]
  '`': [ '`', 'π' ]
  '+': [ '+', '±' ]
  '&': [ '&', '※' ]  # 第2个是参考标志
  '?': [ '？', '?' ]
  '!': [ '！', '!' ]
  '\': [ '\', '、' ]
  '|': [ '|', '｜' ]
  '@': [ '@', '©' ]
  '%': [ '%', '‰' ]
  '^': [ '^', '……' ]
  '~': [ '~', '～' ]
  '$': [ '$', '￥' ]

RShift:  # 扩展标点符号漂移映射表
  '.': [ '℃', '°', '℉' ]  # 都有小圆圈
  ',': [ '∈', '⊆', '⊂' ]  # 逗号前后“属于”同一句
  '(': [ '〔', '〘' ]  # 列表中不是圆括号，是方头括号（也叫鱼尾括号或六角括号）
  ')': [ '〕', '〙' ]
  '_': [ '∪', '∩' ]  # 和减号的∨∧在同一按键
  ':': [ '∵', '∴', '∷' ]  # 都是小点点
  '/': [ '／', '≠', '√' ]  # 都有斜杠或开除之意
  '=': [ '⇒', '⇔', '≡', '≌' ]  # 意思或形状相近
  '<': [ '〈', '≤', '«', '‹' ]
  '>': [ '〉', '≥', '»', '›' ]
  ';': [ '✅', '☐', '☑', '☒' ]  # 此按键在“？”键附近，同是✔❌
  '-': [ '∨', '∧' ]  # -有非（¬）的意思，∨∧同属逻辑符号
  '{': [ '『', '｛' ]
  '}': [ '』', '｝' ]
  '*': [ '·', '＊', '∏' ]  # 意思或形状相近
  '#': [ '■', '◆', '□', '◇' ]
  '[': [ '〖', '［' ]
  ']': [ '〗', '］' ]
  '`': [ 'α', 'β', 'γ', 'λ', 'μ' ]  # 大小写希腊字母在同一按键
  '+': [ '∑', '∫', '∮' ]  # 求和、累积之意
  '&': [ '§', '∞', '∝' ]
  '?': [ '✔', '❌', '✘', '⭕' ]  # 问题的答案是✔或❌
  '!': [ '⚠', '🚨', '▲', '△' ]  # 都有警告之意
  '\': [ '→', '↔', '←', '＼' ]  # 和↑、↓在同一个按键
  '|': [ '↑', '↕', '↓', '‖' ]
  '@': [ '●', '®', '™', '○' ]
  '%': [ '⭐', '★', '✪', '☆' ]  # 五角星放在数字5按键
  '^': [ '⌘', '⌥', '⇧', '↩' ]  # ^是Ctrl，键盘按键符号一类
  '~': [ 'Δ', 'Ω', 'Θ', 'Λ', 'Φ' ]  # 大小写希腊字母在同一按键
  '$': [ '＄', '¥', '£', '€', '¢', '¤' ]  # 第1个是全角美元，第2个是半角元
